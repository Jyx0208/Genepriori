[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genepriori"
version = "0.2.0"
description = "Leakage-aware gene prioritization with evidence fusion, dual-holdout evaluation, and network propagation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Yuxuan Jiang" }]
keywords = [
    "bioinformatics",
    "gene prioritization",
    "drug targets",
    "network propagation",
    "data leakage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
genepriori = "genepriori.cli:main"

[project.urls]
Homepage = "https://github.com/Jyx0208/Genepriori"
Issues = "https://github.com/Jyx0208/Genepriori/issues"

[tool.setuptools.packages.find]
include = ["genepriori*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
